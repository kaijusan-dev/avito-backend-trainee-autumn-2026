openapi: 3.0.3
info:
  title: Avito Kitchen - Platform API
  version: 1.0.0
  description: API платформы для веб-клиента

servers:
  - url: http://localhost:3000

tags:
  - name: restaurants
    description: Заведения и меню
  - name: orders
    description: Заказы

paths:
  /restaurants:
    get:
      tags: [restaurants]
      summary: Список активных заведений
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantListItem'

  /restaurants/{id}:
    get:
      tags: [restaurants]
      summary: Карточка заведения
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants/{id}/menu:
    get:
      tags: [restaurants]
      summary: Меню заведения (проксируется в restaurant-api)
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /orders:
    post:
      tags: [orders]
      summary: Создать заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /orders/{id}:
    get:
      tags: [orders]
      summary: Заказ по id
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ItemNotFound'

components:
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RestaurantListItem:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }

    Restaurant:
      allOf:
        - $ref: '#/components/schemas/RestaurantListItem'
        - type: object
          required: [serviceUrl]
          properties:
            serviceUrl: { type: string, format: uri }

    Category:
      type: object
      required: [id, name, products]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    Product:
      type: object
      required: [id, name, price, isAvailable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price:
          type: integer
          description: Цена в копейках
        isAvailable: { type: boolean }

    CreateOrder:
      type: object
      required: [restaurantId, customerName, customerPhone, fulfillmentType, items]
      properties:
        restaurantId: { type: string, format: uuid }
        customerName: { type: string, minLength: 1, maxLength: 100 }
        customerPhone: { type: string, minLength: 5, maxLength: 30 }
        fulfillmentType:
          type: string
          enum: [DELIVERY, PICKUP]
        deliveryAddress:
          type: string
          maxLength: 300
          description: Обязателен при fulfillmentType=DELIVERY
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 100 }

    OrderItem:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        unitPrice: { type: integer, description: Цена в копейках }
        quantity: { type: integer }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        fulfillmentType: { type: string, enum: [DELIVERY, PICKUP] }
        deliveryAddress: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, COMPLETED]
        totalPrice: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    ErrorResponse:
      type: object
      required: [success, status, code, message, timestamp]
      properties:
        success: { type: boolean, enum: [false] }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        stack: { type: string, nullable: true }

  responses:
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ItemNotFound:
      description: Заказ не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Конфликт (товар недоступен, заказ завершён)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: restaurant-api недоступен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }