openapi: 3.0.3
info:
  title: Avito Kitchen - Restaurant API
  version: 1.0.0
  description: API сервиса заведения

servers:
  - url: http://localhost:3001

tags:
  - name: restaurant
  - name: menu
  - name: products
  - name: orders

paths:
  /restaurant:
    get:
      tags: [restaurant]
      summary: Информация о заведении
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'

  /menu:
    get:
      tags: [menu]
      summary: Меню заведения
      parameters:
        - name: includeUnavailable
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          description: Включить недоступные товары
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'

  /products/lookup:
    post:
      tags: [products]
      summary: Актуальные цены и наличие по списку productIds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds]
              properties:
                productIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'

  /products/{id}:
    patch:
      tags: [products]
      summary: Обновить товар
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, nullable: true, maxLength: 1000 }
                price: { type: integer, minimum: 0 }
                isAvailable: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [orders]
      summary: Принять заказ от platform-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformOrder'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [orders]
      summary: Список заказов
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      tags: [orders]
      summary: Заказ по id
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    patch:
      tags: [orders]
      summary: Сменить статус заказа
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, REJECTED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, COMPLETED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Restaurant:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }

    Category:
      type: object
      required: [id, name, products]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }

    Product:
      type: object
      required: [id, name, price, isAvailable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: integer, description: В копейках }
        isAvailable: { type: boolean }

    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, COMPLETED]

    CreatePlatformOrder:
      type: object
      required: [platformOrderId, customerName, customerPhone, fulfillmentType, items]
      properties:
        platformOrderId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        fulfillmentType: { type: string, enum: [DELIVERY, PICKUP] }
        deliveryAddress: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 100 }

    OrderItem:
      type: object
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        unitPrice: { type: integer }
        quantity: { type: integer }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        fulfillmentType: { type: string, enum: [DELIVERY, PICKUP] }
        deliveryAddress: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OrderStatus' }
        totalPrice: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    ErrorResponse:
      type: object
      required: [success, status, code, message, timestamp]
      properties:
        success: { type: boolean, enum: [false] }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        stack: { type: string, nullable: true }

  responses:
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Конфликт
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }